[package]
name = "audit"
version = "0.8.1"
authors = ["Corentin Henry <corentinhenry@gmail.com>"]
edition = "2018"
keywords = ["netlink", "ip", "linux", "audit"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/rust-netlink/audit"
description = "linux audit via netlink"

[dependencies]
futures = "0.3.11"
thiserror = "1"
netlink-packet-audit = { git = "https://github.com/rust-netlink/netlink-packet-audit", branch = "main" }
netlink-packet-core = { version = "1.0.0-rc2" }
netlink-proto = { version = "1.0.0-rc2", default-features = false }
log = "0.4.8"
libc = "0.2"

[features]
default = ["tokio_socket"]
tokio_socket = ["netlink-proto/tokio_socket"]
smol_socket = ["netlink-proto/smol_socket"]

[dev-dependencies]
tokio = { version = "1.0.1", default-features = false, features = ["macros", "rt-multi-thread"] }
async-std = { version = "1.9.0", features = ["attributes"] }
env_logger = "0.8.2"

[[example]]
name = "events_async"
required-features = ["smol_socket"]
